[project]
name = "ai-cs-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "docling>=2.108.0",
    "fastapi>=0.138.2",
    "jieba>=0.42.1",
    "langchain>=1.3.11",
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.3",
    "langfuse>=4.13.0",
    "langgraph>=1.2.7",
    "mcp>=1.28.1",
    "mem0ai>=2.0.11",
    "openpyxl>=3.1.5",
    "prometheus-client>=0.25.0",
    "pydantic-settings>=2.14.2",
    "pymilvus>=3.0.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "setfit>=1.1.3",
    "sqlalchemy>=2.0.51",
    "transformers<5",
    "uvicorn[standard]>=0.49.0",  # standard: WS(websockets)/uvloop/httptools，Stage 15 WS 端点必需
    "zhconv>=1.4.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["pymilvus.*", "jieba.*", "setfit.*", "datasets.*", "sklearn.*", "openpyxl.*", "docx.*", "docling.*", "pypdf.*", "yaml.*", "mem0.*", "zhconv.*", "sentence_transformers.*"]
ignore_missing_imports = true
