# Alembic 配置文件。
# 注意：数据库连接地址不在此写死，而是在 alembic/env.py 中从应用配置 settings 读取，
# 保证与运行时使用同一个 DATABASE_URL。

[alembic]
# 迁移脚本目录
script_location = alembic

# 把项目根目录加入 sys.path，保证 env.py 能 import app 包
prepend_sys_path = .

# 迁移脚本文件名模板，带时间前缀方便排序
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 时区
timezone = UTC

# 不在此处配置 sqlalchemy.url，统一由 env.py 注入

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
